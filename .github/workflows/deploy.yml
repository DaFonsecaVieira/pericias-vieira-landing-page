name: Deploy to Hostinger

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deploy dependencies
        run: npm install axios form-data --no-save

      - name: Create source archive
        run: |
          set -e
          # Wrap inside pericias-vieira-landing-page-main/ to match Hostinger root_directory config
          mkdir -p /tmp/build-staging/pericias-vieira-landing-page-main
          rsync -a --exclude=node_modules --exclude=.next --exclude=out --exclude=.git . /tmp/build-staging/pericias-vieira-landing-page-main/
          cd /tmp/build-staging
          zip -r $GITHUB_WORKSPACE/deploy.zip pericias-vieira-landing-page-main
          ls -lh $GITHUB_WORKSPACE/deploy.zip

      - name: Deploy to Hostinger
        run: node scripts/deploy-hostinger.mjs "$(pwd)/deploy.zip"
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
