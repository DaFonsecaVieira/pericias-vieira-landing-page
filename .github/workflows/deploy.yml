name: Deploy to Hostinger

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create source archive
        run: |
          zip -r deploy.zip . \
            --exclude "node_modules/*" \
            --exclude ".next/*" \
            --exclude "out/*" \
            --exclude ".git/*" \
            --exclude "*.zip"
          echo "Archive size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy to Hostinger
        run: node scripts/deploy-hostinger.mjs deploy.zip
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
