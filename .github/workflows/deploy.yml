name: Deploy to Hostinger

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive (exclude node_modules and build output)
        run: |
          zip -r deploy.zip . \
            --exclude "node_modules/*" \
            --exclude ".next/*" \
            --exclude "out/*" \
            --exclude ".git/*" \
            --exclude "*.zip"

      - name: Deploy to Hostinger via API
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.hostinger.com/v1/hosting/accounts/${{ secrets.HOSTINGER_USERNAME }}/websites/${{ secrets.HOSTINGER_DOMAIN }}/nodejs/builds" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Accept: application/json" \
            -F "archive=@deploy.zip" \
            -F "node_version=22" \
            -F "build_script=build" \
            -F "root_directory=pericias-vieira-landing-page-main" \
            -F "output_directory=.next")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Deploy failed with status $HTTP_CODE"
            exit 1
          fi
          echo "Deploy triggered successfully"
